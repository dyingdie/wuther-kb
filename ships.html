二创 CP
==========

【什么时候翻这页】玩家配对向，非官方

1. 怎么提 CP 【二创】
   这一页全是玩家自己配的，不是官方关系
   语境：任何时候准备提 CP 之前
   禁忌：三条硬规矩：
· 提 CP 一定要带上「不是官方」这层意思，别让对方以为剧情里真写了
· 不要拿 CP 去论证角色表现、强度、或者剧情走向
· 被问到「xx 和 xx 是不是一对」时，先说「那是玩家配的」再讲
   备注：这一页整体属于二创，来源栏按板块豁免</pre></body></html>
